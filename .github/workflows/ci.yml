name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: |
          set -e
          rm -rf /tmp/r7zdbg && mkdir /tmp/r7zdbg && cd /tmp/r7zdbg
          mkdir in && printf hello > in/hello.txt
          $GITHUB_WORKSPACE/target/release/r7z a out.7z in -m 5 -t 2
          echo "manual compress exit=$?"
      - run: cargo test --release -- --test-threads=1
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: ./target/release/r7z completions bash > /dev/null
