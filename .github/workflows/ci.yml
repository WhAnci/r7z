name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - run: |
          cd /tmp
          rm -rf r7zdbg && mkdir r7zdbg && cd r7zdbg
          mkdir in && printf hello > in/hello.txt
          ./target/release/r7z a out.7z in -m 5 -t 2; echo "exit=$?"
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: ./target/release/r7z completions bash > /dev/null